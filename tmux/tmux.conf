# Configuration tmux. Préfixe : Ctrl+B (par défaut), puis la touche indiquée.
# Recharger après modification : Ctrl+B puis r

# Souris : clic pour changer de panneau, molette pour défiler,
# glisser une bordure pour redimensionner (Shift+glisser = sélection normale)
set -g mouse on

# Le texte copié dans tmux arrive dans le presse-papiers du bureau (via Ghostty)
set -g set-clipboard on

# Numéroter fenêtres et panneaux à partir de 1, sans trous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Couleurs 24 bits dans Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# Découper avec | (côte à côte) et - (l'un sous l'autre), dans le dossier courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Config rechargée"

# Barre d'état aux couleurs Catppuccin Mocha (comme Ghostty)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#cba6f7,fg=#1e1e2e"
